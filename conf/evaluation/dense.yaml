    chunk_size: 512
    chunk_overlap: 32
    num_chunks: 1
    chunk_idx: 0
    batch_size: 4
  eval:
    batch_size: 4
    threads: 8


qa:
  max_num_contexts: 15 # 5 is default
  outfolder: null
  use_retrieval_contexts: true
  minicheck_ckpt_path: "/scratch/lamdo/minicheck_ckpts"
  eval_only: false # if true, only do evaluation without generating answer again
  use_chunk: true # if this is true, use top k retrieved chunks. If this is false, use the whole content from top k URL. Note: k is 'max_num_contexts'
  qa_llm_model_name: null
  eval_llm_model_name: gpt-4.1-mini
  eval_llm2_model_name: qwen3-next-80B-A3B


adv_collection:
  llm_model_name: gpt-4.1-mini
  retrieval_model: text-embedding-3-small


